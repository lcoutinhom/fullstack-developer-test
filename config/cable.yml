# Solid Cable (not the in-process async adapter) because the spreadsheet
# import job runs in a separate `bin/jobs` worker process — its broadcasts
# need to reach the browser's connection on the web process, which only a
# shared, DB-backed adapter can do.
development:
  adapter: solid_cable
  connects_to:
    database:
      writing: cable
  polling_interval: 0.1.seconds
  message_retention: 1.day

test:
  adapter: test

production:
  adapter: solid_cable
  connects_to:
    database:
      writing: cable
  polling_interval: 0.1.seconds
  message_retention: 1.day
